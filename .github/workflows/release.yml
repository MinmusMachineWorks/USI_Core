name: Build & release

# Every push and PR: package the mod and validate its .ckan (dry run, uploaded as an artifact).
# A v*.*.* tag: also create the GitHub release and publish the .ckan to KSP-Mods-CKAN.
# Versions are upstream's plus a fourth number for our fixes, e.g. v112.0.1.1.

on:
  push:
    branches: ['**']
    tags: ['v*.*.*']
  pull_request:

jobs:
  release:
    permissions:
      contents: write
    uses: MinmusMachineWorks/KSP-Mods-CKAN/.github/workflows/release-mod.yml@main
    with:
      package-dir: FOR_RELEASE
      publish: ${{ startsWith(github.ref, 'refs/tags/v') }}
    secrets: inherit
